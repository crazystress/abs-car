<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Audiobookshelf for my Car: pantalla del coche con panel izquierdo y el símbolo (libros + auriculares) a la derecha -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d23"/>
      <stop offset="1" stop-color="#0f0f13"/>
    </linearGradient>
    <clipPath id="inner"><rect x="35" y="99" width="442" height="314" rx="37"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b0b0d"/>
  <rect x="28" y="92" width="456" height="328" rx="44" fill="url(#screen)"/>
  <!-- panel izquierdo -->
  <rect x="35" y="99" width="148" height="314" fill="#2c2c34" clip-path="url(#inner)"/>
  <!-- símbolo -->
  <g transform="translate(332 250) scale(1.12)" fill="#f0a53a">
    <path d="M-78 18 V2 a78 78 0 0 1 156 0 V18" fill="none" stroke="#f0a53a" stroke-width="15" stroke-linecap="round"/>
    <rect x="-96" y="6" width="34" height="58" rx="14"/>
    <rect x="62" y="6" width="34" height="58" rx="14"/>
    <rect x="-50" y="-2" width="28" height="76" rx="5" opacity=".95"/>
    <rect x="-16" y="-14" width="30" height="88" rx="5"/>
    <rect x="20" y="4" width="26" height="70" rx="5" opacity=".85" transform="rotate(8 33 74)"/>
    <rect x="-58" y="78" width="116" height="10" rx="5"/>
  </g>
  <!-- marco -->
  <rect x="28" y="92" width="456" height="328" rx="44" fill="none" stroke="#f0a53a" stroke-width="14"/>
</svg>
