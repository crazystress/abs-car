# Add this service to your Audiobookshelf docker-compose (or use it as is).
# 1) Copy .env.example to .env and set your domain.  2) Review the values marked with  <-- CHANGE
services:
  abs-car:
    image: ghcr.io/crazystress/abs-car:latest      # or pin a version, e.g. :1.1.0
    # build: .                                     # alternative: build the image from this repository
    container_name: abs-car
    restart: unless-stopped
    environment:
      - ABS_URL=http://audiobookshelf:80                  # <-- CHANGE: Audiobookshelf container name and internal port
      - BASE_PATH=/car
      - PUBLIC_URL=https://${ABS_DOMAIN}                 # from .env
      - TZ=${TZ:-UTC}                                    # from .env (optional)
    volumes:
      - ./abs-car-data:/data                             # paired cars
    networks:
      - proxy                                              # <-- CHANGE: the network shared with Traefik and Audiobookshelf
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy                       # <-- CHANGE
      - traefik.http.routers.abs-car.rule=Host(`${ABS_DOMAIN}`) && PathPrefix(`/car`)
      - traefik.http.routers.abs-car.priority=100        # takes /car over the Audiobookshelf router
      - traefik.http.routers.abs-car.entrypoints=websecure        # <-- CHANGE: your HTTPS entrypoint
      - traefik.http.routers.abs-car.tls.certresolver=letsencrypt # <-- CHANGE: your certresolver
      - traefik.http.services.abs-car.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
